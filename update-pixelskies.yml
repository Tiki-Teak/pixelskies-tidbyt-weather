name: Update PixelSkies

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixelskies-weather-update
  cancel-in-progress: true

jobs:
  render-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download weather app
        uses: actions/checkout@v5

      - name: Download Pixlet
        shell: bash
        run: |
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
            --output pixlet.tar.gz \
            https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz
          tar --extract --gzip --file pixlet.tar.gz
          chmod +x pixlet

      - name: Render current weather
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if ./pixlet render pixel_skies.star; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Weather service timed out; retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "Render failed after four attempts."
          exit 1

      - name: Update Tidbyt installation
        env:
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
        shell: bash
        run: |
          ./pixlet push \
            --api-token "$TIDBYT_API_TOKEN" \
            --installation-id mountvernonweather \
            "$TIDBYT_DEVICE_ID" \
            pixel_skies.webp
